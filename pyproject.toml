[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flatledger-workspace"
version = "2.3.1"
description = "A device-local household workspace for inventory, space planning and expense reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Satyam Tomar"}]
dependencies = []

[project.scripts]
flatledger = "roommate.server:main"
roomies = "roommate.server:main"
roommate = "roommate.server:main"

[tool.setuptools]
packages = ["roommate"]

[tool.setuptools.data-files]
"share/roommate/web" = ["web/index.html", "web/style.css", "web/app.js", "web/flat.js", "web/costs.js", "web/reports.js", "web/guide.html", "web/guide.css"]
